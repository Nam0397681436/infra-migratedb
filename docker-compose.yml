# Gộp: Postgres + RustFS + Oracle + Kafka (KRaft) + Kafka UI
# Chạy: docker compose up -d
# Lần đầu Oracle tự tạo user IMGDATA + bảng IMAGES (create_user_and_table.sql)

name: platform

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:

  # ───────────── PostgreSQL ─────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      APP_RW_USER: ${APP_RW_USER}
      APP_RW_PASSWORD: ${APP_RW_PASSWORD}
      APP_RO_USER: ${APP_RO_USER}
      APP_RO_PASSWORD: ${APP_RO_PASSWORD}
    command: >
      postgres
      -c password_encryption=scram-sha-256
      -c max_connections=200
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c log_min_duration_statement=1000
    volumes:
      # Dữ liệu PostgreSQL được lưu trên host, không mất khi container bị tạo lại.
      - ./data-postgres:/var/lib/postgresql/data
    configs:
      - source: pg_init
        target: /docker-entrypoint-initdb.d/01-roles.sh
        mode: 0755
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 60s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 4G }
    logging: *logging

  # ───────────── RustFS ─────────────
  # RustFS chạy bằng UID/GID 10001 nên cần sửa quyền thư mục bind mount trước.
  rustfs-permissions:
    image: alpine:3.19
    user: "0:0"
    restart: "no"
    command: ["chown", "-R", "10001:10001", "/data/rustfs"]
    volumes:
      - ./data-rustfs:/data/rustfs
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: rustfs-server
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data/rustfs
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      # Tạm dùng lại credential hiện có trong .env.
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      # Dữ liệu object RustFS được lưu rõ ràng trong thư mục data-rustfs trên host.
      - ./data-rustfs:/data/rustfs
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 60s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 6G }
    logging: *logging

  # Chạy một lần sau khi RustFS sẵn sàng để tạo bucket, policy và user ứng dụng.
  rustfs-init:
    image: rustfs/rc:v0.1.37
    container_name: rustfs-automation
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ADMIN_USER: ${MINIO_ROOT_USER}
      RUSTFS_ADMIN_PASSWORD: ${MINIO_ROOT_PASSWORD}
      RUSTFS_BUCKET: ${MINIO_BUCKET}
      RUSTFS_RW_USER: ${MINIO_RW_USER}
      RUSTFS_RW_PASSWORD: ${MINIO_RW_PASSWORD}
      RUSTFS_RO_USER: ${MINIO_RO_USER}
      RUSTFS_RO_PASSWORD: ${MINIO_RO_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        rc alias set local http://rustfs:9000 \
          "$$RUSTFS_ADMIN_USER" "$$RUSTFS_ADMIN_PASSWORD"
        rc bucket create "local/$$RUSTFS_BUCKET" --ignore-existing

        cat > /tmp/readwrite-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetBucketLocation",
                "s3:ListBucket",
                "s3:ListBucketMultipartUploads"
              ],
              "Resource": ["arn:aws:s3:::$$RUSTFS_BUCKET"]
            },
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetObject",
                "s3:PutObject",
                "s3:DeleteObject",
                "s3:AbortMultipartUpload",
                "s3:ListMultipartUploadParts"
              ],
              "Resource": ["arn:aws:s3:::$$RUSTFS_BUCKET/*"]
            }
          ]
        }
        EOF

        cat > /tmp/readonly-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:GetBucketLocation", "s3:ListBucket"],
              "Resource": ["arn:aws:s3:::$$RUSTFS_BUCKET"]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::$$RUSTFS_BUCKET/*"]
            }
          ]
        }
        EOF

        if ! rc admin policy info local app-bucket-readwrite >/dev/null 2>&1; then
          rc admin policy create local app-bucket-readwrite /tmp/readwrite-policy.json
        fi
        if ! rc admin policy info local app-bucket-readonly >/dev/null 2>&1; then
          rc admin policy create local app-bucket-readonly /tmp/readonly-policy.json
        fi

        if ! rc admin user info local "$$RUSTFS_RW_USER" >/dev/null 2>&1; then
          rc admin user add local "$$RUSTFS_RW_USER" "$$RUSTFS_RW_PASSWORD"
        fi
        if ! rc admin user info local "$$RUSTFS_RO_USER" >/dev/null 2>&1; then
          rc admin user add local "$$RUSTFS_RO_USER" "$$RUSTFS_RO_PASSWORD"
        fi

        rc admin policy attach local app-bucket-readwrite --user "$$RUSTFS_RW_USER"
        rc admin policy attach local app-bucket-readonly --user "$$RUSTFS_RO_USER"
        echo "RustFS init xong: bucket=$$RUSTFS_BUCKET"
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # ───────────── Oracle XE 21c ─────────────
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle_21c_xe
    restart: always
    environment:
      - ORACLE_PASSWORD=Nam12345
    volumes:
      - oracle_data:/opt/oracle/oradata
      # File SQL tự chạy 1 lần sau khi DB khởi tạo xong
      - ./create_user_and_table.sql:/container-entrypoint-initdb.d/01_create_user_and_table.sql:ro
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM dual;' | sqlplus -s system/Nam12345@//localhost:1521/XEPDB1 | grep -q 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    logging: *logging

  # ───────────── Kafka (KRaft – không cần Zookeeper) ─────────────
  kafka:
    image: apache/kafka:4.3.2
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # HOST: ứng dụng trên máy host (localhost:9092)
      # DOCKER: container khác cùng network (kafka:29092)
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_RETENTION_HOURS: 500
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 60s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    logging: *logging

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: -Xms128m -Xmx256m
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: admin123@321
    ports:
      - "127.0.0.1:8080:8080"
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }
    logging: *logging

configs:
  # Script tạo 2 role Postgres – chỉ chạy khi pg_data còn trống (lần đầu tiên)
  pg_init:
    content: |
      #!/bin/bash
      set -e
      psql -v ON_ERROR_STOP=1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" <<EOSQL
      CREATE ROLE $$APP_RW_USER LOGIN PASSWORD '$$APP_RW_PASSWORD';
      CREATE ROLE $$APP_RO_USER LOGIN PASSWORD '$$APP_RO_PASSWORD';
      REVOKE ALL ON DATABASE "$$POSTGRES_DB" FROM PUBLIC;
      REVOKE CREATE ON SCHEMA public FROM PUBLIC;
      GRANT CONNECT ON DATABASE "$$POSTGRES_DB" TO $$APP_RW_USER, $$APP_RO_USER;
      GRANT USAGE ON SCHEMA public TO $$APP_RW_USER, $$APP_RO_USER;
      GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO $$APP_RW_USER;
      GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO $$APP_RW_USER;
      GRANT SELECT ON ALL TABLES IN SCHEMA public TO $$APP_RO_USER;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO $$APP_RW_USER;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO $$APP_RW_USER;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO $$APP_RO_USER;
      ALTER ROLE $$APP_RO_USER SET default_transaction_read_only = on;
      EOSQL

volumes:
  kafka_data:
  oracle_data:
